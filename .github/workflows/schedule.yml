# Weekday schedule: refresh the screen, then mail the digest an hour later.
#
# WHY HERE AND NOT VERCEL CRON
#
# vercel.json carries the same two schedules, but a Vercel cron is registered by
# a DEPLOYMENT, not by the project -- so an undeployed vercel.json declares
# nothing. On 2026-08-24 a deploy was blocked (Vercel could not match the commit
# author to a GitHub account) and its cron block never registered; the live set
# stayed at whatever the previous build declared. GitHub Actions runs against
# whatever is ALREADY deployed, so the schedule works today and keeps working
# regardless of what is stuck in Vercel.
#
# Both are declared. Whichever fires, the routes are idempotent: the refresh
# work list is a set difference over sessions, so a second call the same day
# finds nothing to fetch, and the digest only reads and mails. This workflow
# asks /status first and skips when the Vercel cron already did the work.
#
# TIMING HERE IS UNRELIABLE, NOT MERELY APPROXIMATE. GitHub schedules queue on
# shared runners and the lateness is unbounded in practice. Measured on this
# repo: 24-40 min late on 2026-08-24/25/26, then roughly NINE HOURS late on
# 2026-08-27 (crons of 0 12 and 0 13 fired at 21:24 and 22:39 UTC). Two earlier
# notes here claimed "five to twenty minutes" and then "24 to 40"; both were
# true of the sample in front of them and neither generalised.
#
# So treat this workflow as a BACKUP that eventually runs, never as a morning
# alarm clock. Vercel Cron is the scheduler that matters -- though note the
# Hobby plan's own precision is per-hour (+/-59 min), so 06:00 means "some time
# in the 6 o'clock hour", not 06:00 sharp.
#
# Phoenix is UTC-7 year-round with no DST, so neither schedule drifts.

name: Screener schedule

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 05:00 Phoenix - refresh
    - cron: "0 13 * * 1-5"   # 06:00 Phoenix - digest email
  workflow_dispatch:
    inputs:
      task:
        description: Which endpoint to call
        required: true
        default: digest
        type: choice
        options: [refresh, digest]

# The vercel.app alias, NOT the custom domain: Cloudflare Access fronts
# screener.williamstradingplatform.com and answers 302 to anything without a
# browser identity. The routes are exempt from Access in proxy.ts and
# authenticate with CRON_SECRET instead.
env:
  BASE: https://ai-revolution-screener.vercel.app

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Choose endpoint
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=/api/${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then
            echo "path=/api/refresh" >> "$GITHUB_OUTPUT"
          else
            echo "path=/api/digest" >> "$GITHUB_OUTPUT"
          fi

      # Usually the Vercel cron has already done today's work by the time this
      # backup gets a runner, so ask first and skip if so. Only an explicit
      # "done":true skips: a 404 (deployment older than the probe), a 500, a
      # timeout or anything unexpected falls through to the real call, which
      # is idempotent. A manual dispatch always runs -- asking for it is the
      # point of dispatching it.
      - name: Check whether it is already done
        id: check
        if: github.event_name != 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          path="${{ steps.pick.outputs.path }}"
          code=$(curl -sS -o status.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${BASE}${path}/status" || echo "000")
          echo "GET ${BASE}${path}/status -> HTTP $code"
          cat status.json 2>/dev/null; echo
          if [ "$code" = "200" ] && grep -q '"done":true' status.json; then
            echo "::notice::Skipped ${path}: already done today"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call it
        if: steps.check.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set on this repository."
            exit 1
          fi
          path="${{ steps.pick.outputs.path }}"
          echo "POST ${BASE}${path}"

          # --max-time generously above the routes' own ceilings, which are now
          # 300s (raised from 60 after /api/digest died at ~61s with
          # FUNCTION_INVOCATION_TIMEOUT on 2026-08-27). A refresh that fetches
          # several sessions and repairs split-stranded bars is slow by design,
          # and a client timeout would report failure for work that actually
          # succeeded -- so this must stay ABOVE maxDuration, not equal to it.
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 360 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${BASE}${path}")

          echo "HTTP $code"
          # Secrets never appear in the response, so this is safe to print and
          # it is the only record of what the run actually did.
          cat response.json; echo

          if [ "$code" != "200" ]; then
            echo "::error::${path} returned $code"
            exit 1
          fi

          # A 200 that did not send is still worth surfacing: "sent: false"
          # with a reason is the difference between a quiet morning and a
          # broken pipeline, and it is exactly what a green tick would hide.
          if grep -q '"sent":false' response.json; then
            reason=$(grep -o '"reason":"[^"]*"' response.json || echo '"reason":"unstated"')
            echo "::warning::No email sent - ${reason}"
          fi
